# Opens and updates the release PR from the conventional commits on main, and creates the
# vX.Y.Z tag and GitHub release when that PR merges, as ccf-release-bot. The config is
# release-please-config.json (the shared defaults) and .release-please-manifest.json.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please

jobs:
  release-please:
    uses: compliance-framework/workflows/.github/workflows/release-please.yml@05d2c3233de6e302c4ff891dde1132d440c081e4 # v1.6.0
    permissions:
      contents: read
    secrets: inherit
