# Cuts the next release candidate (vX.Y.Z-rcN) of the version the open release-please PR
# proposes, as ccf-release-bot; release.yml then publishes :X.Y.Z-rcN. Run it by hand.
name: cut-prerelease
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cut:
    uses: compliance-framework/workflows/.github/workflows/cut-prerelease.yml@e85d35af2af2ddfcd4b92061d2063e665c1831f6 # v1.7.0
    permissions:
      contents: read
    secrets: inherit
