# Cuts the next release candidate (vX.Y.Z-rcN) of the version the open release-please PR
# proposes, as ccf-release-bot; release.yml then publishes :X.Y.Z-rcN. Run it by hand.
name: cut-prerelease
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cut:
    uses: compliance-framework/workflows/.github/workflows/cut-prerelease.yml@05d2c3233de6e302c4ff891dde1132d440c081e4 # v1.6.0
    permissions:
      contents: read
    secrets: inherit
